{% extends 'base.html' %}

{% block title %}Passwort geändert - Your Media Collection{% endblock %}

{% block content %}
<div class="password-change-done-page">
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h1>Passwort erfolgreich geändert</h1>
        <p>Ihr Passwort wurde erfolgreich aktualisiert.</p>
        <div class="actions">
            <a href="{% url 'home' %}" class="btn btn-primary">Zur Startseite</a>
        </div>
    </div>
</div>

<style>
.password-change-done-page {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 200px);
    padding: 20px;
}

.success-container {
    background: white;
    border-radius: 8px;
    padding: 40px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    max-width: 500px;
    width: 100%;
    text-align: center;
}

.success-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #2ecc71;
    color: white;
    font-size: 48px;
    line-height: 80px;
    margin: 0 auto 20px;
}

.success-container h1 {
    margin-bottom: 15px;
    color: #2c3e50;
}

.success-container p {
    color: #7f8c8d;
    margin-bottom: 30px;
    font-size: 16px;
}

.actions {
    display: flex;
    justify-content: center;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    text-decoration: none;
    display: inline-block;
}

.btn-primary {
    background: #3498db;
    color: white;
}

.btn-primary:hover {
    background: #2980b9;
}
</style>
{% endblock %}
